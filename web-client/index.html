<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perception CAD</title>
    <style>
      :root {
        color-scheme: dark;
        --panel: rgba(10, 14, 24, 0.72);
        --text: #f2f5ff;
        --muted: #b7c0d8;
        --accent: #4f8cff;
        --ok: #3dd68c;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%; overflow: hidden;
        background: #0a0c12;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: var(--text);
      }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }

      #overlay {
        position: fixed; inset: 0;
        pointer-events: none;
        z-index: 10;
      }
      #overlay .hit { pointer-events: auto; }

      #arButton {
        position: fixed; top: 16px; right: 16px; z-index: 12;
      }

      #micButton {
        position: fixed;
        bottom: 28px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 12;
        width: 72px;
        height: 72px;
        padding: 0;
        border-radius: 50%;
        font-size: 13px;
        letter-spacing: 0.02em;
        background: rgba(255,255,255,0.14);
        border: 2px solid rgba(255,255,255,0.22);
      }
      #micButton.talking {
        background: #e53935;
        border-color: #ff8a80;
        box-shadow: 0 0 0 6px rgba(229, 57, 53, 0.28);
      }

      /* Legacy HUD - hidden by default, enable via ?debug=hud */
      #hud {
        position: fixed; left: 12px; right: 12px; bottom: 18px;
        display: none; justify-content: center;
      }
      #hud.debug-visible { display: flex; }
      .panel {
        pointer-events: auto;
        background: var(--panel);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 18px;
        padding: 14px 16px;
        width: min(440px, 100%);
        text-align: center;
      }
      h1 { margin: 0 0 6px; font-size: 17px; font-weight: 700; }
      .status { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.4; min-height: 1.2em; }
      .ok { color: var(--ok); }
      .hint { margin-top: 8px; font-size: 12px; color: var(--muted); opacity: 0.9; }

      button {
        appearance: none; border: 0; border-radius: 999px;
        padding: 14px 22px; font-weight: 700; font-size: 15px;
        cursor: pointer; background: var(--accent); color: white;
        touch-action: none; user-select: none;
      }
      button.secondary { background: rgba(255,255,255,0.12); }

      /* Minimal status indicator - always visible when in debug mode */
      #minimalStatus {
        position: fixed;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--panel);
        backdrop-filter: blur(8px);
        border-radius: 8px;
        padding: 6px 12px;
        font-size: 12px;
        color: var(--muted);
        display: none;
        pointer-events: none;
      }
      #minimalStatus.debug-visible { display: block; }
      #minimalStatus.ok { color: var(--ok); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <button id="arButton" class="secondary hit">Enter AR</button>

    <div id="overlay">
      <button id="micButton" class="hit" type="button" aria-label="Hold to talk">Hold</button>
      <!-- Legacy HUD - hidden by default -->
      <div id="hud">
        <div class="panel hit">
          <h1>Perception CAD</h1>
          <p class="status" id="status">Initializing Percy...</p>
          <p class="hint">
            <b>Hold</b> left trigger / pinch / Space / mic to talk. Release to send.
            Right pinch the model to move it. <b>M</b> mutes.
            <br>Try: "build me a star", "make it yellow", "bigger"
          </p>
        </div>
      </div>

      <!-- Minimal debug status (small text, only shown with ?debug) -->
      <div id="minimalStatus"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
