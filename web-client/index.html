<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perception CAD</title>
    <style>
      :root {
        color-scheme: dark;
        --panel: rgba(10, 14, 24, 0.72);
        --text: #f2f5ff;
        --muted: #b7c0d8;
        --accent: #4f8cff;
        --ok: #3dd68c;
        --rec: #e53935;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%; overflow: hidden;
        background: #0a0c12;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: var(--text);
      }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }

      /* DOM Overlay root — visible in Quest passthrough AR */
      #overlay {
        position: fixed; inset: 0;
        pointer-events: none;
        z-index: 10;
      }
      #overlay .hit { pointer-events: auto; }

      #arButton {
        position: fixed; top: 16px; right: 16px; z-index: 12;
      }

      #hud {
        position: fixed; left: 12px; right: 12px; bottom: 18px;
        display: flex; justify-content: center;
      }
      .panel {
        pointer-events: auto;
        background: var(--panel);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 18px;
        padding: 14px 16px;
        width: min(440px, 100%);
        text-align: center;
      }
      h1 { margin: 0 0 6px; font-size: 17px; font-weight: 700; }
      p, .status { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.4; }
      .status { margin-top: 8px; min-height: 1.2em; }
      .ok { color: var(--ok); }
      .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
      button {
        appearance: none; border: 0; border-radius: 999px;
        padding: 14px 22px; font-weight: 700; font-size: 15px;
        cursor: pointer; background: var(--accent); color: white;
        touch-action: none; user-select: none;
      }
      button.secondary { background: rgba(255,255,255,0.12); }
      button.recording { background: var(--rec); transform: scale(1.04); }
      #talkBtn { min-width: 180px; min-height: 52px; }
      .hint { margin-top: 8px; font-size: 12px; color: var(--muted); opacity: 0.9; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <button id="arButton" class="secondary hit">Enter AR</button>

    <div id="overlay">
      <div id="hud">
        <div class="panel hit">
          <h1>Perception CAD</h1>
          <p>Passthrough — a bright ring should appear in front of you. Hold to talk.</p>
          <p class="status" id="status">Ready.</p>
          <div class="row">
            <button id="talkBtn" type="button">Hold to talk</button>
            <button id="demoBtn" class="secondary" type="button">Demo: ring</button>
          </div>
          <p class="hint">
            In headset: poke <b>HOLD TO TALK</b> or squeeze controller — hold ~1s, speak clearly, release.
            Try: ring, box/cube, cylinder/tube · make it yellow · bigger / thicker.
          </p>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
