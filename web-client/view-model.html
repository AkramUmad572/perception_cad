<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Model viewer</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1a1c22; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; }
      #label {
        position: fixed; left: 16px; bottom: 16px;
        color: #f2f5ff; font: 14px/1.4 system-ui, sans-serif;
        background: rgba(10,14,24,0.7); padding: 8px 12px; border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <div id="label">Loading model…</div>
    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.module.js",
          "three/addons/": "/node_modules/three/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

      const params = new URLSearchParams(location.search);
      const src = params.get("src") || "/media/glb/3418f275feed.glb";
      document.getElementById("label").textContent = src;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x2a2d36);
      const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 20);
      camera.position.set(0.35, 0.2, 0.55);
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      document.body.appendChild(renderer.domElement);
      scene.environment = new THREE.PMREMGenerator(renderer).fromScene(
        new RoomEnvironment(), 0.04
      ).texture;
      scene.add(new THREE.AmbientLight(0xffffff, 0.8));
      const key = new THREE.DirectionalLight(0xffffff, 1.6);
      key.position.set(0.6, 1.2, 0.8);
      scene.add(key);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      const gltf = await new GLTFLoader().loadAsync(src);
      const obj = gltf.scene;
      const box = new THREE.Box3().setFromObject(obj);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      obj.position.sub(center);
      const longest = Math.max(size.x, size.y, size.z) || 1;
      obj.scale.setScalar(0.35 / longest);
      scene.add(obj);
      document.getElementById("label").textContent =
        `${src} · ${size.x.toFixed(3)} × ${size.y.toFixed(3)} × ${size.z.toFixed(3)} m`;

      function tick() {
        controls.update();
        obj.rotation.y += 0.006;
        renderer.render(scene, camera);
        requestAnimationFrame(tick);
      }
      tick();
    </script>
  </body>
</html>
